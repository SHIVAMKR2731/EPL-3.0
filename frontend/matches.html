<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Fixtures & Schedule — EPL 3.0</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .tab-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1.25rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--cyan-accent);
      color: #fff;
      border-color: var(--cyan-accent);
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="brand-logo">
        <div class="logo-icon">⚽</div>
        <span>EPL 3.0</span>
      </a>

      <ul class="nav-links">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/auction.html">Auction</a></li>
        <li><a href="/teams.html">Teams</a></li>
        <li><a href="/matches.html" class="active">Matches</a></li>
        <li><a href="/live-match.html">Live Match</a></li>
        <li><a href="/points-table.html">Points Table</a></li>
        <li><a href="/players.html">Players</a></li>
        <li><a href="/results.html">Results</a></li>
      </ul>

      <div id="nav-live-badge"></div>

      <button class="hamburger" aria-label="Toggle navigation">☰</button>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="container">
    <div style="margin-bottom:2rem;text-align:center;">
      <h1 style="font-size:2.5rem;">TOURNAMENT FIXTURES & SCHEDULE</h1>
      <p style="color:var(--text-muted);">View all upcoming matches, live score centers, and completed results.</p>
    </div>

    <!-- FILTER TABS -->
    <div style="display:flex;justify-content:center;gap:0.75rem;margin-bottom:2rem;flex-wrap:wrap;">
      <button class="tab-btn active" onclick="filterMatchesTab('', this)">All Fixtures</button>
      <button class="tab-btn" onclick="filterMatchesTab('UPCOMING', this)">Upcoming</button>
      <button class="tab-btn" onclick="filterMatchesTab('LIVE', this)">🔴 Live Now</button>
      <button class="tab-btn" onclick="filterMatchesTab('COMPLETED', this)">Completed</button>
    </div>

    <!-- MATCHES GRID -->
    <div id="matches-grid-container" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(360px, 1fr));gap:1.5rem;">
      <p style="color:var(--text-muted);grid-column:1/-1;text-align:center;">Loading fixtures...</p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="container">
      <p>&copy; 2026 EPL 3.0 College Football League. All rights reserved.</p>
    </div>
  </footer>

  <script src="/socket.io/socket.io.js" onerror="this.onerror=null;this.src='https://cdn.socket.io/4.7.5/socket.io.min.js'"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/matches.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
